<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Distribuição percentual das mortes violentas intencionais (MVI)</text>
  <text x="320" y="42" text-anchor="middle" font-size="12" fill="#333">por cor/raça e categoria de registro — Brasil, 2023</text>

  <!-- Eixo Y -->
  <g font-size="11" fill="#333">
    <text x="44" y="72" text-anchor="end">100%</text>
    <text x="44" y="130" text-anchor="end">80%</text>
    <text x="44" y="188" text-anchor="end">60%</text>
    <text x="44" y="246" text-anchor="end">40%</text>
    <text x="44" y="304" text-anchor="end">20%</text>
    <text x="44" y="362" text-anchor="end">0%</text>
  </g>
  <!-- Linhas de grade -->
  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="52" y1="68" x2="600" y2="68"/>
    <line x1="52" y1="126" x2="600" y2="126"/>
    <line x1="52" y1="184" x2="600" y2="184"/>
    <line x1="52" y1="242" x2="600" y2="242"/>
    <line x1="52" y1="300" x2="600" y2="300"/>
  </g>
  <line x1="52" y1="358" x2="600" y2="358" stroke="#666" stroke-width="1.5"/>

  <!-- Escala: 0%=y358, 100%=y68 => 2.9 px por %. Barras empilhadas Negro (base) + Branco (topo). -->
  <!-- Categoria 1: Homicidio  Negro 77.8 / Branco 21.7 -->
  <g>
    <rect x="70" y="132.4" width="60" height="225.6" fill="#4b3f72"/>
    <text x="100" y="250" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">77,8</text>
    <rect x="70" y="69.5" width="60" height="62.9" fill="#b7a7d6"/>
    <text x="100" y="105" text-anchor="middle" font-size="11" fill="#333">21,7</text>
  </g>
  <!-- Categoria 2: Latrocinio  Negro 60.9 / Branco 39 -->
  <g>
    <rect x="176" y="181.4" width="60" height="176.6" fill="#4b3f72"/>
    <text x="206" y="275" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">60,9</text>
    <rect x="176" y="68.3" width="60" height="113.1" fill="#b7a7d6"/>
    <text x="206" y="128" text-anchor="middle" font-size="11" fill="#333">39</text>
  </g>
  <!-- Categoria 3: Lesao Corporal Seguida de Morte  Negro 73.9 / Branco 25.5 -->
  <g>
    <rect x="282" y="143.7" width="60" height="214.3" fill="#4b3f72"/>
    <text x="312" y="255" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">73,9</text>
    <rect x="282" y="69.8" width="60" height="73.9" fill="#b7a7d6"/>
    <text x="312" y="111" text-anchor="middle" font-size="11" fill="#333">25,5</text>
  </g>
  <!-- Categoria 4: Morte decorrente de intervencao policial  Negro 82.7 / Branco 17 -->
  <g>
    <rect x="388" y="118.2" width="60" height="239.8" fill="#4b3f72"/>
    <text x="418" y="245" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">82,7</text>
    <rect x="388" y="68.9" width="60" height="49.3" fill="#b7a7d6"/>
    <text x="418" y="98" text-anchor="middle" font-size="11" fill="#333">17</text>
  </g>
  <!-- Categoria 5: MVI  Negro 78.0 / Branco 21.5 -->
  <g>
    <rect x="494" y="131.8" width="60" height="226.2" fill="#4b3f72"/>
    <text x="524" y="250" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">78,0</text>
    <rect x="494" y="69.4" width="60" height="62.4" fill="#b7a7d6"/>
    <text x="524" y="105" text-anchor="middle" font-size="11" fill="#333">21,5</text>
  </g>

  <!-- Rotulos eixo X -->
  <g font-size="10" fill="#222" text-anchor="middle">
    <text x="100" y="374">Homicídio</text>
    <text x="206" y="374">Latrocínio</text>
    <text x="312" y="374">Lesão Corporal</text>
    <text x="312" y="386">Seguida de Morte</text>
    <text x="418" y="374">Morte decorrente</text>
    <text x="418" y="386">de intervenção policial</text>
    <text x="524" y="374">MVI</text>
  </g>

  <!-- Legenda -->
  <g font-size="12" fill="#222">
    <rect x="150" y="404" width="14" height="14" fill="#b7a7d6"/>
    <text x="170" y="415">Branco</text>
    <rect x="260" y="404" width="14" height="14" fill="#4b3f72"/>
    <text x="280" y="415">Negro</text>
    <text x="360" y="415" font-size="10" fill="#666">(Fonte: Anuário Brasileiro de Segurança Pública, FBSP, 2024)</text>
  </g>
</svg>
