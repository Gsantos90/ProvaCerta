<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Domicílios com acesso a computador e internet por região</text>
  <text x="320" y="42" text-anchor="middle" font-size="12" fill="#333">Brasil, 2023 (% do total de domicílios)</text>

  <!-- Eixo Y -->
  <g font-size="10" fill="#555">
    <text x="44" y="74" text-anchor="end">100%</text>
    <text x="44" y="134" text-anchor="end">75%</text>
    <text x="44" y="194" text-anchor="end">50%</text>
    <text x="44" y="254" text-anchor="end">25%</text>
    <text x="44" y="314" text-anchor="end">0%</text>
  </g>
  <g stroke="#e3e3e3" stroke-width="1">
    <line x1="50" y1="70" x2="600" y2="70"/>
    <line x1="50" y1="130" x2="600" y2="130"/>
    <line x1="50" y1="190" x2="600" y2="190"/>
    <line x1="50" y1="250" x2="600" y2="250"/>
  </g>
  <line x1="50" y1="310" x2="600" y2="310" stroke="#666" stroke-width="1.5"/>

  <!-- Escala: 0%=y310, 100%=y70 => 2.4 px por %. Para cada regiao: barra Computador (esq) e Internet (dir). -->
  <!-- Brasil 41/84 -->
  <g>
    <rect x="70" y="211.6" width="24" height="98.4" fill="#9bb4d8"/><text x="82" y="205" text-anchor="middle" font-size="10" fill="#333">41</text>
    <rect x="96" y="108.4" width="24" height="201.6" fill="#2f4b82"/><text x="108" y="102" text-anchor="middle" font-size="10" fill="#333">84</text>
    <text x="95" y="326" text-anchor="middle" font-size="10" fill="#222" font-weight="bold">Brasil</text>
  </g>
  <!-- Norte 33/79 -->
  <g>
    <rect x="160" y="230.8" width="24" height="79.2" fill="#9bb4d8"/><text x="172" y="224" text-anchor="middle" font-size="10" fill="#333">33</text>
    <rect x="186" y="120.4" width="24" height="189.6" fill="#2f4b82"/><text x="198" y="114" text-anchor="middle" font-size="10" fill="#333">79</text>
    <text x="185" y="326" text-anchor="middle" font-size="10" fill="#222">Norte</text>
  </g>
  <!-- Nordeste 39/87 -->
  <g>
    <rect x="250" y="216.4" width="24" height="93.6" fill="#9bb4d8"/><text x="262" y="210" text-anchor="middle" font-size="10" fill="#333">39</text>
    <rect x="276" y="101.2" width="24" height="208.8" fill="#2f4b82"/><text x="288" y="95" text-anchor="middle" font-size="10" fill="#333">87</text>
    <text x="275" y="326" text-anchor="middle" font-size="10" fill="#222">Nordeste</text>
  </g>
  <!-- Centro-Oeste 50/89 -->
  <g>
    <rect x="340" y="190" width="24" height="120" fill="#9bb4d8"/><text x="352" y="184" text-anchor="middle" font-size="10" fill="#333">50</text>
    <rect x="366" y="96.4" width="24" height="213.6" fill="#2f4b82"/><text x="378" y="90" text-anchor="middle" font-size="10" fill="#333">89</text>
    <text x="365" y="326" text-anchor="middle" font-size="10" fill="#222">C.-Oeste</text>
  </g>
  <!-- Sudeste 47/85 -->
  <g>
    <rect x="430" y="197.2" width="24" height="112.8" fill="#9bb4d8"/><text x="442" y="191" text-anchor="middle" font-size="10" fill="#333">47</text>
    <rect x="456" y="106" width="24" height="204" fill="#2f4b82"/><text x="468" y="100" text-anchor="middle" font-size="10" fill="#333">85</text>
    <text x="455" y="326" text-anchor="middle" font-size="10" fill="#222">Sudeste</text>
  </g>
  <!-- Sul 27/80 -->
  <g>
    <rect x="520" y="245.2" width="24" height="64.8" fill="#9bb4d8"/><text x="532" y="239" text-anchor="middle" font-size="10" fill="#333">27</text>
    <rect x="546" y="118" width="24" height="192" fill="#2f4b82"/><text x="558" y="112" text-anchor="middle" font-size="10" fill="#333">80</text>
    <text x="545" y="326" text-anchor="middle" font-size="10" fill="#222">Sul</text>
  </g>

  <!-- Legenda e numeros totais -->
  <g font-size="11" fill="#222">
    <rect x="120" y="350" width="14" height="14" fill="#9bb4d8"/><text x="140" y="361">Computador</text>
    <rect x="250" y="350" width="14" height="14" fill="#2f4b82"/><text x="270" y="361">Internet</text>
  </g>
  <g font-size="10" fill="#444">
    <text x="320" y="388" text-anchor="middle">33,6 mi só com Internet · 546 mil só com computador · 30,3 mi com ambos · 11,5 mi sem ambos</text>
    <text x="320" y="404" text-anchor="middle" fill="#666">(Fonte: TIC Domicílios 2023 — Comitê Gestor da Internet no Brasil, 2024, p. 29)</text>
  </g>
</svg>
