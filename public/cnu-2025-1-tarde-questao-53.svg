<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" font-family="Arial, Helvetica, sans-serif">
  <rect width="680" height="620" fill="#ffffff"/>
  <text x="340" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Evolução histórica das taxas de mortalidade e DALY segundo sexo e grupo de causa</text>
  <text x="340" y="40" text-anchor="middle" font-size="11" fill="#333">Brasil, 1990–2019 (Fonte: GBD, 2021 — Martins et al., 2021)</text>

  <!-- ============ Painel 1: Doencas Infecciosas ============ -->
  <text x="340" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Doenças Infecciosas</text>
  <!-- DALY (esq) -->
  <g>
    <text x="40" y="80" font-size="9" fill="#555">DALY (por 100 mil)</text>
    <line x1="60" y1="80" x2="60" y2="170" stroke="#888"/>
    <line x1="60" y1="170" x2="300" y2="170" stroke="#888"/>
    <text x="56" y="172" text-anchor="end" font-size="8" fill="#555">0</text>
    <text x="56" y="84" text-anchor="end" font-size="8" fill="#555">16000</text>
    <!-- Total (escuro), Masculino (medio), Feminino (claro) - todas em queda -->
    <polyline points="60,92 120,112 180,132 240,146 300,152" fill="none" stroke="#2f3b57" stroke-width="2"/>
    <polyline points="60,100 120,120 180,138 240,150 300,156" fill="none" stroke="#8a93a8" stroke-width="1.8"/>
    <polyline points="60,108 120,126 180,142 240,153 300,159" fill="none" stroke="#c4cad6" stroke-width="1.8"/>
    <text x="180" y="186" text-anchor="middle" font-size="8" fill="#555">1990 — 2019 (Ano)</text>
  </g>
  <!-- Mortalidade (dir) -->
  <g>
    <text x="360" y="80" font-size="9" fill="#555">Mortalidade (por 100 mil)</text>
    <line x1="380" y1="80" x2="380" y2="170" stroke="#888"/>
    <line x1="380" y1="170" x2="620" y2="170" stroke="#888"/>
    <text x="376" y="172" text-anchor="end" font-size="8" fill="#555">0</text>
    <text x="376" y="84" text-anchor="end" font-size="8" fill="#555">250</text>
    <polyline points="380,96 440,116 500,134 560,148 620,154" fill="none" stroke="#2f3b57" stroke-width="2"/>
    <polyline points="380,104 440,122 500,140 560,152 620,158" fill="none" stroke="#8a93a8" stroke-width="1.8"/>
    <polyline points="380,112 440,128 500,144 560,155 620,161" fill="none" stroke="#c4cad6" stroke-width="1.8"/>
    <text x="500" y="186" text-anchor="middle" font-size="8" fill="#555">1990 — 2019 (Ano)</text>
  </g>

  <!-- ============ Painel 2: Doencas Cronicas ============ -->
  <text x="340" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Doenças Crônicas</text>
  <g>
    <text x="40" y="250" font-size="9" fill="#555">DALY (por 100 mil)</text>
    <line x1="60" y1="250" x2="60" y2="340" stroke="#888"/>
    <line x1="60" y1="340" x2="300" y2="340" stroke="#888"/>
    <text x="56" y="342" text-anchor="end" font-size="8" fill="#555">0</text>
    <text x="56" y="254" text-anchor="end" font-size="8" fill="#555">35000</text>
    <polyline points="60,266 120,278 180,290 240,300 300,308" fill="none" stroke="#2f3b57" stroke-width="2"/>
    <polyline points="60,274 120,286 180,297 240,306 300,314" fill="none" stroke="#8a93a8" stroke-width="1.8"/>
    <polyline points="60,282 120,293 180,303 240,311 300,318" fill="none" stroke="#c4cad6" stroke-width="1.8"/>
    <text x="180" y="356" text-anchor="middle" font-size="8" fill="#555">1990 — 2019 (Ano)</text>
  </g>
  <g>
    <text x="360" y="250" font-size="9" fill="#555">Mortalidade (por 100 mil)</text>
    <line x1="380" y1="250" x2="380" y2="340" stroke="#888"/>
    <line x1="380" y1="340" x2="620" y2="340" stroke="#888"/>
    <text x="376" y="342" text-anchor="end" font-size="8" fill="#555">0</text>
    <text x="376" y="254" text-anchor="end" font-size="8" fill="#555">900</text>
    <polyline points="380,272 440,284 500,296 560,306 620,312" fill="none" stroke="#2f3b57" stroke-width="2"/>
    <polyline points="380,280 440,292 500,303 560,312 620,318" fill="none" stroke="#8a93a8" stroke-width="1.8"/>
    <polyline points="380,288 440,299 500,309 560,317 620,323" fill="none" stroke="#c4cad6" stroke-width="1.8"/>
    <text x="500" y="356" text-anchor="middle" font-size="8" fill="#555">1990 — 2019 (Ano)</text>
  </g>

  <!-- ============ Painel 3: Causas Externas ============ -->
  <text x="340" y="406" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Causas Externas</text>
  <g>
    <text x="40" y="420" font-size="9" fill="#555">DALY (por 100 mil)</text>
    <line x1="60" y1="420" x2="60" y2="510" stroke="#888"/>
    <line x1="60" y1="510" x2="300" y2="510" stroke="#888"/>
    <text x="56" y="512" text-anchor="end" font-size="8" fill="#555">0</text>
    <text x="56" y="424" text-anchor="end" font-size="8" fill="#555">10000</text>
    <polyline points="60,440 120,436 180,444 240,452 300,458" fill="none" stroke="#2f3b57" stroke-width="2"/>
    <polyline points="60,448 120,444 180,452 240,460 300,466" fill="none" stroke="#8a93a8" stroke-width="1.8"/>
    <polyline points="60,486 120,484 180,486 240,488 300,490" fill="none" stroke="#c4cad6" stroke-width="1.8"/>
    <text x="180" y="526" text-anchor="middle" font-size="8" fill="#555">1990 — 2019 (Ano)</text>
  </g>
  <g>
    <text x="360" y="420" font-size="9" fill="#555">Mortalidade (por 100 mil)</text>
    <line x1="380" y1="420" x2="380" y2="510" stroke="#888"/>
    <line x1="380" y1="510" x2="620" y2="510" stroke="#888"/>
    <text x="376" y="512" text-anchor="end" font-size="8" fill="#555">0</text>
    <text x="376" y="424" text-anchor="end" font-size="8" fill="#555">180</text>
    <polyline points="380,452 440,448 500,456 560,462 620,466" fill="none" stroke="#2f3b57" stroke-width="2"/>
    <polyline points="380,460 440,456 500,464 560,470 620,474" fill="none" stroke="#8a93a8" stroke-width="1.8"/>
    <polyline points="380,492 440,490 500,492 560,494 620,496" fill="none" stroke="#c4cad6" stroke-width="1.8"/>
    <text x="500" y="526" text-anchor="middle" font-size="8" fill="#555">1990 — 2019 (Ano)</text>
  </g>

  <!-- Legenda -->
  <g font-size="10" fill="#222">
    <line x1="190" y1="560" x2="214" y2="560" stroke="#2f3b57" stroke-width="3"/>
    <text x="220" y="563">Total</text>
    <line x1="290" y1="560" x2="314" y2="560" stroke="#8a93a8" stroke-width="3"/>
    <text x="320" y="563">Masculino</text>
    <line x1="400" y1="560" x2="424" y2="560" stroke="#c4cad6" stroke-width="3"/>
    <text x="430" y="563">Feminino</text>
  </g>
</svg>
